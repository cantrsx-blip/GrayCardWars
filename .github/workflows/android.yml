name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME"
          java -version
          adb version

      - name: Build Godot Android APK
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: false
          export_debug: true

      - name: Collect APK
        run: |
          mkdir -p artifact
          APK=$(find "$HOME/.local/share/godot/builds" . -type f -name '*.apk' 2>/dev/null | head -n 1)
          echo "APK=$APK"
          test -n "$APK"
          cp "$APK" artifact/GrayCardWars.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GrayCardWars-Android
          path: artifact/GrayCardWars.apk
          if-no-files-found: error
