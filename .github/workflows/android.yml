name: Diagnose and Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Godot 4.5.1 and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz -O /tmp/templates.tpz
          unzip -q -j /tmp/templates.tpz -d "$HOME/.local/share/godot/export_templates/4.5.1.stable"

      - name: Create Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$HOME/.android/debug.keystore" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Extract realistic survival assets
        run: |
          test -f GrayCardWars_Realistic_Survival_Assets.zip
          rm -rf assets
          unzip -q -o GrayCardWars_Realistic_Survival_Assets.zip -d .
          git checkout HEAD -- assets/environment/coast/og.jpg || true
          test -d assets
          echo "Asset files: $(find assets -type f | wc -l)"
          find assets -type f | head -30

      - name: Initialize Godot editor settings
        run: |
          GODOT=/tmp/godot/Godot_v4.5.1-stable_linux.x86_64
          "$GODOT" --headless --editor --path . --quit

      - name: Configure Godot Android paths
        run: |
          SETTINGS="$HOME/.config/godot/editor_settings-4.5.tres"
          test -f "$SETTINGS"
          python3 - <<'PY'
          import os, re
          p=os.path.expanduser('~/.config/godot/editor_settings-4.5.tres')
          s=open(p, encoding='utf-8').read()
          values={
            'export/android/android_sdk_path':'/usr/local/lib/android/sdk',
            'export/android/java_sdk_path':os.environ['JAVA_HOME'],
            'export/android/debug_keystore':os.path.expanduser('~/.android/debug.keystore'),
            'export/android/debug_keystore_user':'androiddebugkey',
            'export/android/debug_keystore_pass':'android',
          }
          for k,v in values.items():
              line=f'{k} = "{v}"'
              pat=re.compile(r'^'+re.escape(k)+r'\s*=.*$', re.M)
              if pat.search(s): s=pat.sub(line,s)
              else: s += '\n'+line+'\n'
          open(p,'w',encoding='utf-8').write(s)
          PY
          test -f "$HOME/.android/debug.keystore"

      - name: Import project
        run: |
          GODOT=/tmp/godot/Godot_v4.5.1-stable_linux.x86_64
          "$GODOT" --headless --editor --path . --quit --verbose

      - name: Validate scripts and runtime
        run: |
          GODOT=/tmp/godot/Godot_v4.5.1-stable_linux.x86_64
          mkdir -p build
          : > build/runtime.log
          set +e
          timeout 25s "$GODOT" --headless --path . --verbose 2>&1 | tee -a build/runtime.log
          STATUS=${PIPESTATUS[0]}
          set -e

          # Keep a compact diagnostic file in the repository workspace so every
          # failed run exposes the exact Godot error lines as an artifact.
          grep -n -E -B3 -A8 "SCRIPT ERROR|Parse Error|Failed to load script|Failed to instantiate|Invalid get index|Invalid call|Parent node is busy"             build/runtime.log > build/godot-errors.txt || true

          echo "===== GODOT ERROR SUMMARY ====="
          cat build/godot-errors.txt || true
          echo "===== END GODOT ERROR SUMMARY ====="

          if [ -s build/godot-errors.txt ]; then
            exit 1
          fi
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
            exit "$STATUS"
          fi

      - name: Direct verbose Android export
        run: |
          mkdir -p build
          GODOT=/tmp/godot/Godot_v4.5.1-stable_linux.x86_64
          set -o pipefail
          "$GODOT" --headless --path . --verbose --export-debug "Android" "$PWD/build/GrayCardWars.apk" 2>&1 | tee build/export.log
          test -f build/GrayCardWars.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GrayCardWars-Android
          path: build/GrayCardWars.apk
          if-no-files-found: error

      - name: Upload diagnostic log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GrayCardWars-Build-Diagnostics
          path: |
            build/export.log
            build/runtime.log
            build/godot-errors.txt
          if-no-files-found: ignore
